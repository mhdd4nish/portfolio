<style>
/* Layout: one long page. The whole site is a "world" that re-themes itself (palette, display type, pattern) when you hover or open a project. */
:root {
  --bg: #F6F2F8;
  --fg: #17131D;
  --muted: #5B5566;
  --accent: #3F3FF0;
  --line: color-mix(in srgb, var(--fg) 22%, transparent);
  --panel: color-mix(in srgb, var(--fg) 7%, transparent);
  --d-family: 'Syne', 'Helvetica Neue', Arial, sans-serif;
  --d-weight: 800;
  --d-style: normal;
  --d-case: none;
  --d-track: -0.02em;
  --body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
/* The home view is one deliberate light look. Each project then sets its own world on top of it. */

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  transition: background-color .6s ease, color .6s ease;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--bg);
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.wrap { max-width: 1180px; margin: 0 auto; }

#world {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .16;
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 85%);
  mask-image: linear-gradient(to bottom, #000 0%, transparent 85%);
  transition: opacity .6s ease;
}
#world svg { width: 100%; height: 100%; display: block; }
#world.home {
  opacity: 1; -webkit-mask-image: none; mask-image: none;
  background:
    radial-gradient(60% 50% at 8% 0%, rgba(255,166,190,.7), transparent 70%),
    radial-gradient(50% 45% at 95% 8%, rgba(160,196,255,.7), transparent 70%),
    radial-gradient(55% 50% at 85% 100%, rgba(255,222,140,.6), transparent 70%),
    radial-gradient(50% 45% at 0% 90%, rgba(178,232,208,.65), transparent 70%);
}

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); border-bottom: 1px solid var(--line);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  transition: background-color .6s ease, border-color .6s ease;
}
.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 12px; }
.brand { font-family: var(--mono); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; }
nav { display: flex; gap: 20px; }
nav a { font-family: var(--mono); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; color: var(--muted); }
nav a:hover { color: var(--accent); }

main, footer { position: relative; z-index: 1; }
section { scroll-margin-top: 64px; }

/* hero */
.hero { padding-block: clamp(40px, 9vw, 110px) clamp(36px, 6vw, 72px); }
.eyebrow { font-family: var(--mono); font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 20px; }
h1#name {
  font-family: var(--d-family); font-weight: var(--d-weight); font-style: var(--d-style);
  text-transform: var(--d-case); letter-spacing: var(--d-track);
  font-size: clamp(3.4rem, 15vw, 11.5rem); line-height: .95; margin: 0; min-height: 1.9em;
  text-wrap: balance; overflow-wrap: anywhere;
}
.lede { max-width: 38rem; font-size: 1.15rem; margin: 24px 0 0; }
.now {
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; margin: 32px 0 0;
  font-family: var(--mono); font-size: .8rem; letter-spacing: .06em; text-transform: uppercase;
}
.now b { color: var(--accent); font-weight: 500; }
.now span#now { color: var(--fg); min-width: 0; }

/* section heads */
h2 {
  font-family: var(--d-family); font-weight: var(--d-weight); font-style: var(--d-style);
  text-transform: var(--d-case); letter-spacing: var(--d-track);
  font-size: clamp(2rem, 6vw, 3.6rem); line-height: 1; margin: 0; text-wrap: balance;
}
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 32px; margin-bottom: 28px; }
.hint { font-family: var(--mono); font-size: .78rem; letter-spacing: .05em; color: var(--muted); margin: 0; max-width: 28rem; }

/* project index */
#list { border-bottom: 1px solid var(--line); }
.proj { border-top: 1px solid var(--line); scroll-margin-top: 60px; }
.row {
  all: unset; box-sizing: border-box; cursor: pointer; width: 100%;
  display: grid; grid-template-columns: 4rem minmax(0, 1fr) auto 2rem; align-items: baseline; gap: 8px 20px;
  padding-block: 22px;
}
.row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.yr { font-family: var(--mono); font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.ttl { font-size: clamp(2rem, 6.5vw, 4.4rem); line-height: 1; overflow-wrap: anywhere; transition: color .25s ease; }
.row:hover .ttl, .proj.open .ttl { color: var(--accent); }
.cat { font-family: var(--mono); font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: right; }
.pm { font-family: var(--mono); font-size: 1.5rem; text-align: right; color: var(--accent); }

.detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 32px 48px; padding-block: 8px 48px; }
.detail .brief { font-size: 1.12rem; margin: 0 0 24px; max-width: 34rem; }
dl.facts { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 10px 16px; margin: 0 0 28px; }
dl.facts dt { font-family: var(--mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
dl.facts dd { margin: 0; }
.sub { font-family: var(--mono); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
ol.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: s; }
ol.steps li { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: 16px; padding-top: 10px; border-top: 1px solid var(--line); }
ol.steps li b { font-weight: 500; color: var(--accent); }

.gal { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-content: start; min-width: 0; }
.gal .tile { background: var(--panel); border: 1px solid var(--line); min-width: 0; overflow: hidden; }
.gal .tall { grid-row: span 2; display: grid; place-items: center; padding: 14px; color: var(--fg); }
.gal .tall svg { width: 100%; max-height: 420px; }
.gal .swatch svg { display: block; width: 100%; aspect-ratio: 1; }
.gal .pal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
.gal .pal span { display: block; padding: 22px 0 6px; font-family: var(--mono); font-size: .62rem; text-align: center; mix-blend-mode: normal; }
.gal figure { margin: 0; grid-column: span 2; }
.gal figure img { display: block; width: 100%; height: auto; }
.gal figcaption { font-family: var(--mono); font-size: .75rem; color: var(--muted); padding: 8px 12px; }
.chipbar { display: grid; grid-template-columns: repeat(4, 1fr); }
.chipbar div { height: 54px; }
.chipcap { display: grid; grid-template-columns: repeat(4, 1fr); font-family: var(--mono); font-size: .64rem; color: var(--muted); padding: 6px 8px 8px; gap: 4px; }

/* about */
#about { padding-block: clamp(56px, 9vw, 110px) 0; }
.about-grid { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 36px 56px; align-items: start; }
.portrait {
  aspect-ratio: 4 / 5; max-width: 100%; border: 1px solid var(--line); background: var(--panel);
  display: grid; place-items: center; position: relative; overflow: hidden;
}
.portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
.portrait .mono {
  font-family: var(--d-family); font-weight: var(--d-weight); font-style: var(--d-style);
  text-transform: var(--d-case); font-size: clamp(6rem, 22vw, 12rem); color: var(--accent); line-height: 1;
}
.portrait small { position: absolute; left: 12px; bottom: 10px; font-family: var(--mono); font-size: .7rem; letter-spacing: .06em; color: var(--muted); }
.about-grid p { margin: 0 0 16px; max-width: 36rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0 0 28px; list-style: none; }
.chips li { border: 1px solid var(--line); padding: 4px 12px; font-size: .88rem; }
.edu { display: grid; gap: 0; margin: 0; }
.edu div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding-block: 12px; border-top: 1px solid var(--line); }
.edu span:last-child { font-family: var(--mono); font-size: .8rem; color: var(--muted); }

/* contact */
#contact { padding-block: clamp(56px, 9vw, 110px) clamp(56px, 9vw, 100px); }
.mail { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin: 24px 0 20px; }
.mail code {
  font-family: var(--d-family); font-weight: var(--d-weight); font-style: var(--d-style); text-transform: var(--d-case);
  font-size: clamp(1.4rem, 5vw, 2.8rem); line-height: 1.1; overflow-wrap: anywhere; user-select: all;
}
button.copy {
  font-family: var(--mono); font-size: .75rem; letter-spacing: .06em; text-transform: uppercase;
  background: transparent; color: var(--fg); border: 1px solid var(--fg); padding: 8px 14px; cursor: pointer;
}
button.copy:hover { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.links { display: flex; flex-wrap: wrap; gap: 8px 24px; font-family: var(--mono); font-size: .85rem; letter-spacing: .05em; text-transform: uppercase; }
.links a { color: var(--accent); text-underline-offset: 4px; }

footer { border-top: 1px solid var(--line); padding-block: 20px 28px; font-family: var(--mono); font-size: .75rem; color: var(--muted); }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }

@media (max-width: 820px) {
  .detail, .about-grid { grid-template-columns: minmax(0, 1fr); }
  .portrait { max-width: 320px; }
}
@media (max-width: 560px) {
  .row { grid-template-columns: minmax(0, 1fr) 2rem; }
  .yr { grid-column: 1; grid-row: 1; }
  .ttl { grid-column: 1; grid-row: 2; }
  .cat { grid-column: 1; grid-row: 3; text-align: left; }
  .pm { grid-column: 2; grid-row: 1 / span 3; align-self: center; }
  dl.facts { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  dl.facts dd { margin-bottom: 10px; }
  ol.steps li { grid-template-columns: minmax(0, 1fr); gap: 2px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; }
}

    case 'dots': return { w: 36, h: 36, s: `<rect width="36" height="36" fill="${a}"/><circle cx="9" cy="9" r="5" fill="${b}"/><circle cx="27" cy="27" r="5" fill="${b}"/><circle cx="27" cy="9" r="2.5" fill="${d}"/><circle cx="9" cy="27" r="2.5" fill="${e}"/>` };
    case 'stripe': return { w: 32, h: 32, s: `<rect width="32" height="32" fill="${a}"/><path d="M-16 16L16 -16M0 32L32 0M16 48L48 16" stroke="${b}" stroke-width="7"/><path d="M-28 16L4 -16M-12 32L20 0M4 48L36 16" stroke="${d}" stroke-width="2"/>` };
    case 'tartan': return { w: 48, h: 48, s: `<rect width="48" height="48" fill="${a}"/><rect x="6" width="14" height="48" fill="${b}" opacity=".72"/><rect y="6" width="48" height="14" fill="${b}" opacity=".72"/><rect x="28" width="2" height="48" fill="${d}" opacity=".9"/><rect y="28" width="48" height="2" fill="${d}" opacity=".9"/><rect x="37" width="1" height="48" fill="${e}"/><rect y="37" width="48" height="1" fill="${e}"/><circle cx="13" cy="13" r="1.8" fill="${d}"/>` };
    case 'wave': return { w: 48, h: 36, s: `<rect width="48" height="36" fill="${a}"/><path d="M0 6Q12 -2 24 6T48 6" fill="none" stroke="${b}" stroke-width="2.5"/><path d="M0 18Q12 10 24 18T48 18" fill="none" stroke="${d}" stroke-width="2.5"/><path d="M0 30Q12 22 24 30T48 30" fill="none" stroke="${e}" stroke-width="2.5"/>` };
    default: return { w: 14, h: 14, s: `<path d="M0 .5H14" style="stroke:var(--fg)" stroke-width=".6"/>` };
  }
}
function patDef(id, p, scale) {
  const t = patternInner(p ? p.pattern : 'home', p ? p.pal : []);
  return `<pattern id="${id}" patternUnits="userSpaceOnUse" width="${t.w}" height="${t.h}" patternTransform="scale(${scale})">${t.s}</pattern>`;
}

const DRESS = 'M70 20L90 20Q100 44 110 20L130 20L135 90L152 280Q100 296 48 280L65 90Z';
const JACKET = 'M60 30Q100 48 140 30L186 62L172 142L146 126L150 272L50 272L54 126L28 142L14 62Z';
function garmentSVG(p) {
  const id = p.id + '-g';
  const path = p.garment === 'dress' ? DRESS : JACKET;
  const detail = p.garment === 'dress'
    ? '<path d="M65 92Q100 104 135 92" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".6"/>'
    : '<path d="M100 44V272M58 206H88M112 206H142" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".6"/>';
  return `<svg viewBox="0 0 200 300" role="img" aria-label="Flat sketch of a ${p.garment} in the ${p.title} print"><defs>${patDef(id, p, 1)}</defs><path d="${path}" fill="url(#${id})" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>${detail}</svg>`;
}
function swatchSVG(p) {
  const id = p.id + '-s';
  return `<svg viewBox="0 0 160 160" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Close-up of the ${p.title} print"><defs>${patDef(id, p, 2.2)}</defs><rect width="160" height="160" fill="url(#${id})"/></svg>`;
}

/* build page content */
function buildStatic() {
  $('#brand').textContent = ME.name;
  $('#foot-name').textContent = `${ME.name} / ${ME.school}`;
  $('#eyebrow').textContent = `${ME.program} / ${ME.year} / ${ME.school}`;
  $('#name').textContent = ME.name;
  $('#lede').textContent = ME.tagline;
  $('#bio').innerHTML = ME.bio.map((t) => `<p>${t}</p>`).join('');
  $('#skills').innerHTML = ME.skills.map((s) => `<li>${s}</li>`).join('');
  $('#edu').innerHTML = ME.education.map((e) => `<div><span>${e[0]}<br><span style="font-family:var(--body);color:var(--muted)">${e[1]}</span></span><span>${e[2]}</span></div>`).join('');
  $('#email').textContent = ME.email;
  $('#links').innerHTML = ME.links.map((l) => `<a href="${l[1]}" target="_blank" rel="noopener">${l[0]}</a>`).join('');
  $('#portrait').innerHTML = ME.photo
    ? `<img src="${ME.photo}" alt="Portrait of ${ME.name}">`
    : `<span class="mono">${ME.name.trim().charAt(0)}</span><small>Photo goes here</small>`;
  document.title = `${ME.name} Portfolio`;
}

function buildList() {
  $('#list').innerHTML = PROJECTS.map((p) => {
    const imgs = p.images.map((im) => `<figure class="tile"><img src="${im.src}" alt="${im.caption || p.title}" loading="lazy">${im.caption ? `<figcaption>${im.caption}</figcaption>` : ''}</figure>`).join('');
    return `<article class="proj" id="${p.id}">
      <button class="row" type="button" aria-expanded="false" aria-controls="d-${p.id}" data-id="${p.id}">
        <span class="yr">${p.year}</span>
        <span class="ttl" style="${fontCSS(p.type)}">${p.title}</span>
        <span class="cat">${p.category}</span>
        <span class="pm" aria-hidden="true">+</span>
      </button>
      <div class="detail" id="d-${p.id}" hidden>
        <div>
          <p class="brief">${p.brief}</p>
          <dl class="facts">
            <dt>Term</dt><dd>${p.term}, ${p.year}</dd>
            <dt>Role</dt><dd>${p.role}</dd>
            <dt>Materials</dt><dd>${p.materials}</dd>
            <dt>Techniques</dt><dd>${p.techniques}</dd>
          </dl>
          <p class="sub">Process</p>
          <ol class="steps">${p.steps.map((s) => `<li><b>${s[0]}</b><span>${s[1]}</span></li>`).join('')}</ol>
        </div>
        <div class="gal">
          <div class="tile tall">${garmentSVG(p)}</div>
          <div class="tile swatch">${swatchSVG(p)}</div>
          <div class="tile">
            <div class="chipbar">${p.pal.map((c) => `<div style="background:${c}"></div>`).join('')}</div>
            <div class="chipcap">${p.pal.map((c) => `<span>${c}</span>`).join('')}</div>
          </div>
          ${imgs}
        </div>
      </div>
    </article>`;
  }).join('');
}

/* world state: active (opened) and preview (hovered) */
let active = null, preview = null, cycle = 0;
const current = () => byId(preview || active);

function applyTheme(p) {
  const s = root.style;
  const keys = ['--bg', '--fg', '--muted', '--accent', '--d-family', '--d-weight', '--d-style', '--d-case', '--d-track', 'color-scheme'];
  if (!p) { keys.forEach((k) => s.removeProperty(k)); return; }
  s.setProperty('--bg', p.theme.bg); s.setProperty('--fg', p.theme.fg);
  s.setProperty('--muted', p.theme.muted); s.setProperty('--accent', p.theme.accent);
  s.setProperty('--d-family', p.type.family); s.setProperty('--d-weight', p.type.weight);
  s.setProperty('--d-style', p.type.style); s.setProperty('--d-case', p.type.transform);
  s.setProperty('--d-track', p.type.spacing); s.setProperty('color-scheme', p.theme.scheme);
}
function renderWorld(p) {
  const w = $('#world');
  w.classList.toggle('home', !p);
  w.style.opacity = p && p.worldOpacity ? p.worldOpacity : '';
  w.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" style="opacity:${p ? 1 : .1}"><defs>${patDef('wp', p, p ? 2.4 : 1)}</defs><rect width="100%" height="100%" fill="url(#wp)"/></svg>`;
}
function setView() {
  const p = current();
  applyTheme(p);
  renderWorld(p);
  $('#now').textContent = p ? `${p.title}. ${p.mood}.` : 'Choose a project below. The whole site changes with it.';
  if (p) $('#name').removeAttribute('style');
}

function setActive(id, scroll) {
  active = id;
  document.querySelectorAll('.proj').forEach((el) => {
    const open = el.id === id;
    el.classList.toggle('open', open);
    el.querySelector('.row').setAttribute('aria-expanded', String(open));
    el.querySelector('.detail').hidden = !open;
    el.querySelector('.pm').textContent = open ? '−' : '+';
  });
  try { history.replaceState(null, '', id ? '#' + id : location.pathname + location.search); } catch (e) {}
  setView();
  if (id && scroll) { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' }); }
}

function bind() {
  document.querySelectorAll('.row').forEach((btn) => {
    const id = btn.dataset.id;
    btn.addEventListener('click', () => setActive(active === id ? null : id, active !== id));
    if (canHover) {
      btn.addEventListener('pointerenter', () => { preview = id; setView(); });
      btn.addEventListener('pointerleave', () => { preview = null; setView(); });
    }
    btn.addEventListener('focus', () => { if (!canHover) return; preview = id; setView(); });
    btn.addEventListener('blur', () => { preview = null; setView(); });
  });
  $('#copy').addEventListener('click', async () => {
    const btn = $('#copy');
    try {
      await navigator.clipboard.writeText(ME.email);
      btn.textContent = 'Copied';
    } catch (e) {
      const r = document.createRange(); r.selectNodeContents($('#email'));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      btn.textContent = 'Press copy now';
    }
    setTimeout(() => { btn.textContent = 'Copy email'; }, 1800);
  });
  window.addEventListener('hashchange', () => {
    const p = byId(location.hash.slice(1));
    if (p && p.id !== active) setActive(p.id, true);
  });
  /* the name cycles through every project's typeface while no project is chosen */
  if (!reduced) {
    setInterval(() => {
      const n = $('#name');
      if (current()) return;
      const t = PROJECTS[cycle++ % PROJECTS.length].type;
      n.setAttribute('style', fontCSS(t));
    }, 2200);
  }
}

buildStatic();
buildList();
bind();
const start = byId(location.hash.slice(1));
setView();
if (start) setActive(start.id, true);
</script>

</body></html>
